[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "assignment_of_cases_to_variants"
version = "1.0"
description = "Assigns COVID-19 case data to individual variants using logistic growth fitting"
readme = "README.md"

authors = [
    {name = "Marvin Schulte", email = "marvin.schulte@itwm.fraunhofer.de"}
]

requires-python = ">=3.10"

dependencies = [
    "matplotlib>=3.5.0",
    "numpy>=1.20.0",
    "openpyxl>=3.0.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
include = ["assignment_of_cases_to_variants*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=assignment_of_cases_to_variants --cov-report=term-missing"
